name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          S=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$S" ]; then
            echo "settings.gradle.kts nao encontrado. Arquivos:"
            find . -not -path "./.git/*" -type f
            exit 1
          fi
          cd "$(dirname "$S")"
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LiteLauncher-apk
          path: "**/app-debug.apk"
